name: Static renderer checks

on:
  push:
  pull_request:

jobs:
  renderer:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash
      - name: Run renderer checks
        shell: bash
        env:
          CI_OS: ${{ runner.os }}
        run: |
          if [ "$CI_OS" = "Linux" ]; then
            xvfb-run -a bun test
            xvfb-run -a bun run test:tree-ui
            xvfb-run -a bun run test:coordinates
            xvfb-run -a bun run test:dpi
          else
            bun test
            bun run test:tree-ui
            bun run test:coordinates
            bun run test:dpi
          fi
      - name: Build production renderer and Electron entrypoints
        run: bun run build
        shell: bash
